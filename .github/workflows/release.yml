# .github/workflows/release.yml
name: Release app
on:
  workflow_dispatch:
    inputs:
      # 只构建 whisper.cpp 运行时矩阵、跳过 app 构建：用于发版前干跑验证
      # Vulkan/Metal 工具链。app 构建会 publish 到当前版本的已发布 Release，
      # 所以只验运行时矩阵时必须能整体跳过它
      runtime_only:
        type: boolean
        required: false
        default: false
      # 只打包不上传（electron-forge make，而非 publish）：用于在分支上验证完整
      # 打包链路（含运行内产物注入的 whisper 运行时），不碰 Release
      package_only:
        type: boolean
        required: false
        default: false
  # 供 release-please.yml 在发版 PR 合并后以 workflow_call 直接调用
  # （GITHUB_TOKEN 打的 tag 不会触发 push 事件，不能只靠下面的 tag 触发器）
  workflow_call:
    inputs:
      # 与 workflow_dispatch 的同名开关一致；发版链路固定不传（false）
      runtime_only:
        type: boolean
        required: false
        default: false
      # 同上：发版链路固定不传（false），只给手动干跑用
      package_only:
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # whisper.cpp 核显运行时先行构建，作为本次运行的临时产物（artifact）交给 app 构建，
  # 由 download.mjs 从 DASHPLAYER_WHISPER_RUNTIME_DIR 就地安装。运行时不上传 Release：
  # 发版资产只放安装包，开发机需要运行时就走 download.mjs 的本地源码编译。
  # 矩阵 fail-fast: false：单个目标失败不阻塞其余目标，也不阻塞其他平台的 app 构建；
  # 但缺了自家平台运行时的平台会构建失败（download.mjs 在 CI 下不编译兜底、不静默跳过），
  # 避免发出一个默认识别引擎不可用的包
  whisper-cpp-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, gpu: vulkan }
          - { name: win32-x64, os: windows-2022, gpu: vulkan }
          - { name: darwin-arm64, os: macos-14, gpu: metal }
          - { name: darwin-x64, os: macos-15-intel, gpu: metal }
    runs-on: ${{ matrix.os }}
    env:
      # 运行时基于固定版本的 whisper.cpp 构建；parakeet-cli 输出格式是
      # 解析契约（见 WhisperCppCli.parseOutput），升级前需重新验证
      WHISPER_CPP_REF: 52a939a2a762224e255d366c1182b2af4dd1a032
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_CPP_REF }}
      - name: Install Vulkan toolchain (Linux only)
        if: matrix.gpu == 'vulkan' && runner.os == 'Linux'
        run: |
          # ggml 的 ggml-vulkan 要的是 glslc（find_package(Vulkan COMPONENTS glslc REQUIRED)）
          # 与 SPIRV-Headers 的 cmake config，Ubuntu 自带的 glslang-tools 只提供
          # glslangValidator，装完仍然找不到 glslc；与 llama.cpp 一致，
          # 从 LunarG 的 jammy 源装完整 SDK（源码里两处硬依赖都在里面）
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/keyrings/lunarg.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/lunarg.asc] https://packages.lunarg.com/vulkan jammy main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-jammy.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y vulkan-sdk
      - name: Install Vulkan SDK (Windows only)
        if: matrix.gpu == 'vulkan' && runner.os == 'Windows'
        shell: pwsh
        env:
          # 必须用 1.4.x：1.3.290 的 SDK 不带 SPIRV-Headers 的 cmake config，
          # 而 ggml 的 ggml-vulkan 是 find_package(SPIRV-Headers CONFIG REQUIRED)
          # （实测 1.3.290 报 Could not find a package configuration file
          # provided by "SPIRV-Headers"）；与 llama.cpp 的版本保持一致
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: Configure (Vulkan)
        if: matrix.gpu == 'vulkan'
        env:
          # Windows 用静态 CRT（/MT）：MSVC 默认 /MD 会让 parakeet-cli.exe 依赖
          # VCRUNTIME140.dll / MSVCP140.dll（来自 VC++ Redistributable，干净系统上不保证存在）
          MSVC_RUNTIME_FLAG: ${{ runner.os == 'Windows' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' || '' }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF $MSVC_RUNTIME_FLAG
      - name: Configure (Metal)
        if: matrix.gpu == 'metal'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_METAL_USE_BF16=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=${{ contains(matrix.name, 'arm64') && 'arm64' || 'x86_64' }} -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target parakeet-cli -j 4
      - name: Package
        # 资产名契约：scripts/download.mjs 的 whisperRuntimeAssetName() 按同一套
        # whisper-cpp-<platform>-<arch>.{tar.gz,zip} 规则去临时产物目录里找归档，改名必须两边同步
        shell: bash
        run: |
          mkdir -p stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/Release/parakeet-cli.exe stage/parakeet-cli.exe
            (cd stage && 7z a "../whisper-cpp-${{ matrix.name }}.zip" parakeet-cli.exe)
          else
            cp build/bin/parakeet-cli stage/parakeet-cli
            (cd stage && tar czf "../whisper-cpp-${{ matrix.name }}.tar.gz" parakeet-cli)
          fi
      - name: Upload runtime artifact
        # 只留在本次运行内：app 构建要的就是同一份二进制，直接递过去，
        # 既不用等 Release 先存在，也不会在构建失败时留下“有运行时、没安装包”的半成品 Release
        uses: actions/upload-artifact@v7
        with:
          name: whisper-runtime-${{ matrix.name }}
          path: whisper-cpp-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7
  build:
    # needs 只为保证运行内产物先产出再被下载（download.mjs 从
    # DASHPLAYER_WHISPER_RUNTIME_DIR 就地安装，运行时不经过 Release）；
    # 配合 !cancelled() 让运行时任务失败时其余平台照常构建（缺自家平台运行时的那一平台
    # 会在安装步骤显式失败）；runtime_only 给手动干跑用，理由同上
    needs: whisper-cpp-runtime
    if: ${{ !cancelled() && !inputs.runtime_only }}
    strategy:
      # 某个平台构建失败时，其他平台继续构建发布，不互相拖累
      fail-fast: false
      matrix:
        os:
          [
            { name: 'linux', image: 'ubuntu-latest' },
            { name: 'windows', image: 'windows-2022' },
            { name: 'macos-x64', image: 'macos-15-intel' },
            { name: 'macos-arm64', image: 'macos-14' },
          ]
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: yarn
      - name: Install WiX Toolset (Windows only)
        if: matrix.os.name == 'windows'
        run: |
          choco install wixtoolset
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $GITHUB_PATH
      # AppImage maker (@reforged/maker-appimage) 需要系统提供 mksquashfs，
      # 显式安装而不依赖 runner 镜像恰好预装
      - name: Install squashfs-tools (Linux only)
        if: matrix.os.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Install dependencies
        if: matrix.os.name != 'windows'
        run: yarn install --frozen-lockfile
      - name: Install dependencies with Visual Studio (Windows only)
        if: matrix.os.name == 'windows'
        shell: cmd
        run: call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 && yarn install --frozen-lockfile
      - name: Download whisper runtime artifacts
        # 某个平台运行时没构建出来时不在这里报错：下载不到与产物缺失都会落到
        # download.mjs 的安装步骤，由它在 CI 下带原因显式失败
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: whisper-runtime-*
          path: .ci-runtime
          merge-multiple: true
      - name: Publish app
        if: matrix.os.name != 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 主进程 bundle 已大过 V8 默认 ~2GB 堆上限，构建时 OOM（v6.7.0 arm64 dmg 缺失的直接原因）
          NODE_OPTIONS: --max-old-space-size=4096
          # 运行时由本次运行的产物提供，download.mjs 直接就地安装
          DASHPLAYER_WHISPER_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime
        # package_only：只跑 make 验证打包，不做 GitHub 发布
        run: npm run ${{ inputs.package_only && 'make' || 'publish' }}
      - name: Publish app with Visual Studio (Windows only)
        if: matrix.os.name == 'windows'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          DASHPLAYER_WHISPER_RUNTIME_DIR: ${{ github.workspace }}\.ci-runtime
        run: call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 && npm run ${{ inputs.package_only && 'make' || 'publish' }}
