<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    DashPlayer 应用图标。
    画布 1024×1024，三层：白色圆角底板 / 深灰字母 d / 黄色星星，每层各带一道向下偏移的投影。
    改配色只需替换三处 fill：底板 #FFFFFF、字母 #5A5A5A、星星 #FFD700。
    去掉底板和 filter 属性就是透明底的纯图形版本，可直接用于托盘、关于页或网站。
  -->
  <defs>
    <!-- 底板投影：偏移 11，模糊半径 5，黑色 30% -->
    <filter id="shadow-plate" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <!-- 字母投影 -->
    <filter id="shadow-glyph" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.27"/>
    </filter>
    <!-- 星星投影 -->
    <filter id="shadow-star" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 底板：830×830 圆角矩形，圆角 178 -->
  <rect id="plate" x="97.3" y="97.3" width="830.1" height="830.1" rx="178" fill="#FFFFFF" filter="url(#shadow-plate)"/>

