<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 不要用 black-translucent：那会让页面画到状态栏底下，iOS 26 会把那条做成毛玻璃，视频和列表滚到下面时顶部发糊；
         而且这种模式下 CSS 量到的视口比实际绘制区域矮一个状态栏（实测视口 793 / 窗口 852），外壳高度怎么算都不对。
         用 default：页面从状态栏下方开始，量到的就是真的。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>DashPlayer</title>
    <script>
        // 首屏先套用已保存的主题，避免浅色用户看到一帧深色。键名与 src/mobile/theme.ts 一致。
        (function () {
            try {
                var theme = localStorage.getItem('dashplayer.mobile.theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.dataset.theme = theme;
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) {
                        meta.setAttribute('content', theme === 'light' ? '#f5f4f0' : '#0b0b0b');
                    }
                }
            } catch (error) {
                // 隐私模式下 localStorage 不可用，保持默认深色。
            }
        }());
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
